plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'community-api'

// 파일 업로드 관련 보안 수정이 포함된 Tomcat 사용
ext['tomcat.version'] = '10.1.60'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    byteBuddyAgent {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    // 첨부파일 S3 저장 (AWS SDK v2의 S3 모듈만 추가)
    implementation 'software.amazon.awssdk:s3:2.54.17'

    // 로그아웃한 토큰 보관
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'org.springframework.boot:spring-boot-starter-batch'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    byteBuddyAgent 'net.bytebuddy:byte-buddy-agent'
}

tasks.withType(Test).configureEach {
    // Mockito 에이전트는 테스트 시작 때 연결
    jvmArgs "-javaagent:${configurations.byteBuddyAgent.singleFile.absolutePath}"
    // Mockito 실행 시 CDS 경고가 나지 않도록 설정
    jvmArgs '-Xshare:off'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'docker'
    }
}

tasks.register('dockerTest', Test) {
    description = 'Runs integration tests against disposable MySQL and Redis containers.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'docker'
    }
    // 현재 Testcontainers가 Docker 29에서도 실행되도록 API 버전 지정
    systemProperty 'api.version', '1.44'
    shouldRunAfter tasks.named('test')
}
