# EC2 호스트에서 Spring Boot JAR를 실행하고,
# MySQL과 Redis는 Docker 컨테이너로 실행.

services:
  mysql:
    image: mysql:8.4
    container_name: community-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: community
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 컨테이너 환경변수를 사용하고 실제 인증/DB 준비 상태를 확인한다.
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u root -D community -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: community-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:
