version: '3.8'

services:
  # MySQL 컨테이너 설정
  mysql:
    image: mysql:8.4
    container_name: community-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: community
    volumes:
      - mysql_data:/var/lib/mysql

  # Redis 컨테이너 설정
  redis:
    image: redis:7-alpine
    container_name: community-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: