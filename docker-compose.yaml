services:
  mysql:
    image: mysql:8.4
    container_name: community-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
      MYSQL_DATABASE: community
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: community-redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  mysql_data:
