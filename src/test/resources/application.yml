jwt:
  # 테스트 전용 키입니다. 운영 키는 환경 변수 JWT_SECRET으로만 주입합니다.
  secret: test-secret-key-must-be-at-least-32-bytes-long
  access-expiration-ms: 3600000
  refresh-expiration-ms: 1209600000

spring:
  flyway:
    enabled: false
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
