spring:
  application:
    name: community-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  batch:
    job:
      enabled: false # 서버 실행시 batch 자동실행 방지
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

bootstrap:
  admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
  superadmin:
    enabled: ${BOOTSTRAP_SUPERADMIN_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 3600000 # 한시간 3600000
  refresh-expiration-ms: 1209600000 # 14일

---
# H2 DB (테스트용) URL : localhost:8080/h2-console
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:communitydb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  sql:
    init:
      mode: always
  flyway:
    enabled: false # H2 로컬 테스트 끝나면 켜기

# 로컬 개발 환경에서만 SQL 바인딩 값을 출력한다.
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE

---
# MySQL DB (배포용)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

---
# Docker
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/community?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
