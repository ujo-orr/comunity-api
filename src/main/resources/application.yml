spring:
  application:
    name: community-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  batch:
    job:
      enabled: false # 서버를 켤 때는 배치를 실행하지 않음
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# SQL에 들어가는 이메일, 비밀번호 같은 값은 로그에 남기지 않음
logging:
  level:
    org.hibernate.orm.jdbc.bind: OFF

file:
  storage-type: local
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

bootstrap:
  admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
  superadmin:
    enabled: ${BOOTSTRAP_SUPERADMIN_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 3600000 # 1시간
  refresh-expiration-ms: 1209600000 # 14일

---
# 로컬에서는 H2 사용
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:communitydb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  sql:
    init:
      mode: always
  flyway:
    enabled: false # H2 테이블은 JPA가 생성

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
# 로컬 MySQL 테스트
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/community?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
